<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apnix - Rooms & PG</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6fa;
      color: #222;
    }
    header {
      background: #172554;
      color: white;
      padding: 24px;
      text-align: center;
    }
    main {
      padding: 20px;
      text-align: center;
    }
    .card {
      background: white;
      padding: 20px;
      margin: 15px auto;
      max-width: 450px;
      border-radius: 12px;
    }
    input, button {
      padding: 12px;
      margin: 6px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      background: #172554;
      color: white;
    }
  </style>
</head>
<body>
  <header>
    <h1>Apnix</h1>
    <p>Apna Room, Apni Jagah</p>
  </header>
  <main>
    <h2>Patna mein Room aur PG khojein</h2>
    <input type="text" placeholder="Area ka naam likhein">
    <button>Search</button>
    <div class="card">
      <h3>Apnix par jaldi aa raha hai!</h3>
      <p>Room aur PG ki listings jald hi yahan milengi.</p>
    </div>
  </main>
</body>
</html>
